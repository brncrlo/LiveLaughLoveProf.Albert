<!doctype html>
<html>
  <head>
    <title>User Info Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page">
      <h1>User Information Card</h1>

      <div class="container">
        <!-- LEFT SIDE -->
        <div class="form-box">
          <h2>Personal Information</h2>

          <label class="input-label">Full Name</label>
          <input type="text" id="fullName" placeholder="Enter your full name" />

          <label class="input-label">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email" />

          <label class="input-label">Age</label>
          <input type="number" id="age" placeholder="Enter your age" />

          <label class="input-label">Birthday</label>
          <input type="date" id="birthday" />

          <label class="input-label">Address</label>
          <input type="text" id="address" placeholder="Enter your address" />

          <label class="input-label">Phone Number</label>
          <input type="text" id="phone" placeholder="Enter your phone number" />

          <label class="input-label">Course</label>
          <input type="text" id="course" placeholder="Enter your course" />

          <label class="input-label">School</label>
          <input type="text" id="school" placeholder="Enter your school" />

          <!-- HOBBIES -->
          <label class="input-label">Hobbies</label>

          <div class="hobbies">
            <label>
              <input type="checkbox" name="hobby" value="Playing Games" />
              Playing Games
            </label>

            <label>
              <input type="checkbox" name="hobby" value="Watching Movies" />
              Watching Movies
            </label>

            <label>
              <input type="checkbox" name="hobby" value="Listening to Music" />
              Listening to Music
            </label>

            <label>
              <input type="checkbox" name="hobby" value="Photography" />
              Photography
            </label>

            <label>
              <input type="checkbox" name="hobby" value="Drawing" />
              Drawing
            </label>

            <label>
              <input type="checkbox" name="hobby" value="Listening to Laufey" />
              Listening to Laufey
            </label>

            <label>
              <input type="checkbox" name="hobby" value="Listening toTaylor Swift" />
              Listening to Taylor Swift
            </label>

            <label>
              <input type="checkbox" name="hobby" value="Listening to Sabrina Carpenter" />
              Listening to Sabrina Carpenter
            </label>

            <label>
              <input type="checkbox" name="hobby" value="Listening to Rodel Naval" />
              Listening to Rodel Naval
            </label>
          </div>

          <!-- FAVORITE COLOR -->
          <label class="input-label">Favorite Color</label>

          <select id="favoriteColor">
            <option value="">Choose a color</option>
            <option value="Red">Red</option>
            <option value="Blue">Blue</option>
            <option value="Green">Green</option>
            <option value="Yellow">Yellow</option>
          </select>

          <!-- GENDER -->
          <label class="input-label">Gender</label>

          <div class="gender">
            <label>
              <input type="radio" name="gender" value="Male" />
              Male
            </label>

            <label>
              <input type="radio" name="gender" value="Female" />
              Female
            </label>

            <label>
              <input type="radio" name="gender" value="Prefer not to say" />
              Prefer not to say
            </label>
          </div>

          <button onclick="showInfo()">Show My Info</button>
        </div>

        <!-- RIGHT SIDE -->
        <div class="output-box">
          <div class="output-header">
            <h2>Your Information Card</h2>
          </div>

          <p class="output-description">
            Your information will appear here after you click
            <b>Show My Info</b>.
          </p>

          <div class="information" id="output">
            <p class="empty">No information yet.</p>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
